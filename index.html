<body>

<div class="wrap">
  <header>
    <div class="brand"><h1>Cladle<span class="yomi">クレードル</span></h1><button class="level" id="level" aria-pressed="false" title="ゲキムズモード（1万種以上から出題）">ゲキムズ（試作）</button></div>
    <nav role="tablist">
      <button role="tab" id="tab-daily" data-v="daily" aria-selected="true">今日の動物</button>
      <button role="tab" id="tab-free" data-v="free" aria-selected="false">フリー</button>
      <button role="tab" id="tab-zukan" data-v="zukan" aria-selected="false">図鑑</button>
      <button role="tab" id="tab-howto" data-v="howto" aria-selected="false">遊び方</button>
      <button role="tab" id="tab-about" data-v="about" aria-selected="false">データ</button>
      <button role="tab" id="tab-extra" data-v="extra" aria-selected="false">番外編</button>
    </nav>
  </header>

  <main id="game">
    <p class="level-note" id="levelNote" hidden></p>
    <div class="status"><span id="modeLabel">今日の動物</span><span class="meter" id="meter"></span><span><span id="leftLabel">残り</span> <b id="left">15</b></span></div>
    <div class="inputbox">
      <input id="guess" name="dk-animal" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="動物を入力（ひらがな・カタカナ・学名）" aria-label="動物を入力" role="combobox" aria-expanded="false" aria-controls="sugg">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      <span class="leftpin" id="leftPin" aria-hidden="true"></span>
    </div>
    <div id="flash" class="flash" hidden></div>
    <div id="hints" class="hints" hidden></div>
    <div id="actions" class="actions"></div>
    <div id="board"></div>
    <div id="result"></div>
  </main>

  <main id="zukan" hidden>
    <div class="zukan-tools">
      <input id="zkq" name="dk-zukan" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="図鑑を検索（和名・学名）" aria-label="図鑑を検索">
    </div>
    <div class="zk" id="zk"></div>
  </main>

  <main id="howto" hidden>
    <section class="demo" aria-label="遊び方の例">
      <div class="demo-head"><span class="eyebrow">例題</span><span id="demoStep" class="demo-step"></span></div>
      <div class="demo-input" id="demoInput" aria-hidden="true"><span id="demoTyped"></span><i class="caret"></i></div>
      <p class="demo-cap" id="demoCap"></p>
      <p class="think" id="demoThink"></p>
      <div id="demoBoard"></div>
      <div class="row"><button class="btn ghost" id="demoPrev">前へ</button><button class="btn ghost" id="demoNext">次へ</button><button class="btn" id="demoReplay">最初から再生</button></div>
    </section>
    <div class="doc" id="howtoDoc"></div>
  </main>

  <main id="extra" hidden>
    <div class="doc" id="extraDoc"></div>
  </main>

  <main id="about" hidden>
    <div class="doc" id="doc"></div>
  </main>

</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="in" id="sheetIn"></div></div>

<script src="js/core.js"></script>
<script src="js/daily.js"></script>
<script src="js/game.js"></script>
<script src="js/board.js"></script>
<script src="js/share.js"></script>
<script src="js/input.js"></script>
<script src="js/zukan.js"></script>
<script src="js/texts.js"></script>
<script src="js/howto.js"></script>
<script src="js/main.js"></script>
</body>
</html>

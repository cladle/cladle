# GitHub に送るたびに、データとプログラムに壊れたところがないかを確かめる
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: データの確認
        run: python3 tools/check.py
      - name: JavaScript の文法の確認
        run: for f in js/*.js; do node --check "$f"; done
      - name: 公開用の印付けの確認
        run: cp index.html /tmp/index.html && cp -r css js /tmp/ && python3 tools/stamp.py /tmp/index.html

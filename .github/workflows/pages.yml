# main に入るたびに公開ページを作り直す。
# 公開する index.html だけ、css/・js/ の読み込みに中身の印（?v=…）を付ける（tools/stamp.py）。
# こうすると、直したファイルは再読み込み1回で必ず新しいものが読まれる。
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 読み込みに印を付ける
        run: python3 tools/stamp.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
